<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Selección y Guardado de Archivos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-5">
    <h2 class="text-center">Formulario con Selección y Guardado de Archivos</h2>
    
    <form id="formulario" class="mt-4">
      <div class="mb-3">
        <label for="fileInput" class="form-label">Selecciona un archivo</label>
        <input type="file" id="fileInput" class="form-control" accept=".txt,.jpg,.png" onchange="handleFileSelect(event)">
      </div>
      
      <button type="button" class="btn btn-primary" onclick="downloadFile()">Guardar archivo</button>
    </form>

    <div id="fileInfo" class="mt-3"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Scripts/Script.js"></script>
</body>
</html>
