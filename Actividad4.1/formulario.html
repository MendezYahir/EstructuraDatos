<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario con Pestañas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="panel">
    <h2>Formulario Principal</h2>

    <div class="tab-buttons">
      <button class="tab-link active">Datos Personales</button>
      <button class="tab-link">Información Adicional</button>
    </div>

    <div class="tab-content active">
      <div class="form-control">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre">
      </div>
      <div class="form-control">
        <label for="email">Correo electrónico:</label>
        <input type="text" id="email" placeholder="ejemplo@correo.com">
      </div>
      <button class="submit-btn">Enviar</button>
    </div>

    <div class="tab-content">
      <div class="form-control">
        <label for="comentarios">Comentarios:</label>
        <input type="text" id="comentarios" placeholder="Escribe un comentario">
      </div>
      <div class="form-control">
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" placeholder="1234567890">
      </div>
      <button class="submit-btn">Guardar</button>
    </div>

    <div id="resultado" style="margin-top: 20px;"></div>
  </div>

  <script src="Scripts/script.js"></script>
</body>
</html>
